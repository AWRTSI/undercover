name: FUTMarketWatch
options:
  bundleIdPrefix: com.futmarketwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FUTMarketWatch:
    type: application
    platform: iOS
    sources:
      - path: FUTMarketWatch
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        NSUserNotificationsUsageDescription: >
          FUT Market Watch envoie des notifications lorsqu'une opportunité d'achat ou de revente
          est détectée sur le marché des transferts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.futmarketwatch.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
